<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Binaural HRTF-Conditioned Target Speaker Extraction</title>
<meta name="description" content="Listening examples and evaluation results for HRTF-conditioned binaural target speaker extraction with joint dereverberation.">
<link rel="icon" href="data:,">
<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="assets/site.css">
<script type="module" src="assets/js/app.js"></script>
</head>
<body>
<a class="skip" href="#listening">Skip to listening examples</a>
<header class="site-header">
  <div class="wrap topbar">
    <div>
      <p class="eyebrow">Experiment 2</p>
      <h1>Binaural HRTF-Conditioned Target Speaker Extraction</h1>
    </div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch colour theme"></button>
  </div>
  <nav class="wrap toc" aria-label="Sections"><a href="#listening">Examples</a><a href="#results">Results</a><a href="#protocol">Protocol</a></nav>
</header>

<main class="wrap">
  <section id="listening" aria-labelledby="h-listening">
    <h2 id="h-listening">Listening examples</h2>
    <p class="small">Selected examples; not representative of average performance.</p>
    <div id="examples" class="examples"><p class="loading">Loading examples…</p></div>
  </section>

  <section id="results" aria-labelledby="h-results">
    <h2 id="h-results">Results</h2>
    <div class="overall" id="overall"></div>
    <div class="model-legend" data-legend></div>
    <div class="chart-grid">
      <div class="plot">
        <div class="controls" data-metric-group="training"></div>
        <figure class="chart-card" id="chart-training"></figure>
      </div>
      <div class="plot">
        <div class="controls" data-metric-group="sir"></div>
        <figure class="chart-card" id="chart-sir"></figure>
      </div>
    </div>
  </section>

  <section id="protocol" aria-labelledby="h-protocol">
    <details class="protocol"><summary><h2 id="h-protocol">Evaluation protocol</h2></summary><div data-protocol></div></details>
  </section>
</main>

<footer class="site-footer"><div class="wrap"><p>Research demo.</p></div></footer>
<noscript><p class="wrap">This page needs JavaScript for audio playback and charts.</p></noscript>
</body>
</html>
