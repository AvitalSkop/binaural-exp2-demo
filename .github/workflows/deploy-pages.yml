# Deploy the static demo (site/ only) to GitHub Pages. site/index.html becomes the site root.
# Two jobs: build (validate + upload the Pages artifact) and deploy (needs build). The short wait before deploying
# avoids a race in which deploy-pages could not yet see the freshly uploaded artifact ("No artifacts named github-pages").
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate site (leak scan, data consistency, audio integrity)
        run: python3 tools/check_site.py site

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for the artifact to become available
        run: sleep 45

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
